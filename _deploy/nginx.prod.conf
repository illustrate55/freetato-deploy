# Production nginx config: HTTP→HTTPS redirect + self-signed TLS on 443.
# Используется только при деплое на 10.10.10.65 — для локалки оставляем nginx/nginx.conf.

server {
    listen 80;
    server_name _;
    # Все HTTP-запросы редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/freetato.crt;
    ssl_certificate_key /etc/nginx/certs/freetato.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Корень → dashboard. auth-guard перехватит и при необходимости отправит на login.
    location = / { return 302 /pages/dashboard.html; }

    location /api/ {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health       { proxy_pass http://app:8000/health; }
    location = /docs         { proxy_pass http://app:8000/docs; }
    location = /redoc        { proxy_pass http://app:8000/redoc; }
    location = /openapi.json { proxy_pass http://app:8000/openapi.json; }

    # Картинки/шрифты — долгий кэш
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # JS / CSS / HTML — кэшируем с обязательной ревалидацией через ETag.
    # 304 Not Modified — мгновенно, без скачивания. Сохраняет bfcache браузера
    # (back/forward работают мгновенно). При реальной правке файла приходит 200
    # с новым содержимым — без Ctrl+F5.
    location ~* \.(css|js|html)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /pages/404.html; }

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
