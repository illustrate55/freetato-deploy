server {
    listen 80;
    server_name _;
    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    # Корень редиректит на dashboard. auth-guard перехватит и при необходимости
    # отправит на login.
    location = / { return 302 /pages/dashboard.html; }

    # API прокси на FastAPI
    location /api/ {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # для пакетной ИИ-генерации
    }

    location = /health       { proxy_pass http://app:8000/health; }
    location = /docs         { proxy_pass http://app:8000/docs; }
    location = /redoc        { proxy_pass http://app:8000/redoc; }
    location = /openapi.json { proxy_pass http://app:8000/openapi.json; }

    # Картинки и шрифты — долгий кэш, контент стабильный
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # JS / CSS — браузер хранит в кэше, но обязан ревалидировать через ETag
    # на каждый запрос (304 Not Modified, если не изменился). Это даёт свежие
    # правки без Ctrl+F5 и сохраняет работу bfcache (мгновенный back/forward).
    location ~* \.(css|js|html)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA-fallback — на 404 страницу
    location / { try_files $uri $uri/ /pages/404.html; }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
