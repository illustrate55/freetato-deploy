<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — FREETATO ДПО</title>
  <link rel="icon" type="image/png" href="/assets/img/dino/icon.png">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/login.css">
  <script src="/js/config.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-page__left">
      <img src="/assets/img/dino/main-dino.png" alt="FREETATO ДПО" class="auth-page__dino">
      <h1 class="auth-page__slogan">Учись по своему профилю.<br>Расти быстрее.</h1>
    </div>
    <div class="auth-page__right">
      <form id="login-form" class="auth-form" novalidate>
        <h2 class="auth-form__title">Вход в FREETATO ДПО</h2>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="input" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input type="password" id="password" name="password" class="input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Войти</button>
        <p class="auth-form__hint">
          Нет аккаунта? <a href="/pages/register.html" class="link">Зарегистрироваться</a>
        </p>
      </form>
    </div>
  </div>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
