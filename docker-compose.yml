services:
  postgres:
    image: postgres:15-alpine
    container_name: freetato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: ./backend
    container_name: freetato-app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    volumes:
      - ./backend/certs:/app/certs:ro
    expose: ["8000"]
    healthcheck:
      # GET (а не HEAD как у --spider) — наш /health принимает только GET
      test: ["CMD", "wget", "-qO-", "--tries=1", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: freetato-nginx
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  postgres_data:
